<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>remoteStorage — Allow Access?</title>
    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --border: #e5e5e5;
        --text: #171717;
        --text-secondary: #525252;
        --text-muted: #a3a3a3;
        --accent: #ea580c;
        --green: #16a34a;
        --green-hover: #15803d;
        --green-soft: #f0fdf4;
        --green-border: #bbf7d0;
        --red: #dc2626;
        --red-soft: #fef2f2;
        --yellow-soft: #fffbeb;
        --yellow-border: #fde68a;
        --radius: 10px;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono: "SF Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
      }

      * { box-sizing: border-box; margin: 0; }

      body {
        color: var(--text);
        background: var(--bg);
        font-family: var(--font);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .shell {
        padding: 20px;
        display: grid;
        gap: 16px;
        max-width: 400px;
      }

      /* ── Header ── */
      .consent-header {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .consent-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--yellow-soft);
        border: 1px solid var(--yellow-border);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .consent-icon svg {
        width: 18px;
        height: 18px;
        color: #d97706;
      }

      .consent-header h1 {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
      }

      .consent-header p {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 2px;
      }

      /* ── Detail card ── */
      .detail-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        overflow: hidden;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 10px 12px;
      }

      .detail-row + .detail-row {
        border-top: 1px solid var(--border);
      }

      .detail-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        flex-shrink: 0;
      }

      .detail-value {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        text-align: right;
        word-break: break-all;
        min-width: 0;
      }

      .detail-value.mono {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
      }

      .scope-tag {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--yellow-soft);
        border: 1px solid var(--yellow-border);
        font-size: 11px;
        font-family: var(--mono);
        color: #92400e;
      }

      /* ── Remember ── */
      .remember-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: var(--radius);
        background: var(--surface);
        border: 1px solid var(--border);
        cursor: pointer;
        transition: background 120ms;
      }

      .remember-row:hover { background: var(--bg); }

      .remember-row input {
        margin: 0;
        accent-color: var(--green);
      }

      .remember-row span {
        font-size: 12px;
        color: var(--text-secondary);
      }

      /* ── Actions ── */
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .btn {
        padding: 10px 16px;
        border: none;
        border-radius: var(--radius);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 120ms ease;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-deny {
        color: var(--text-secondary);
        background: var(--surface);
        border: 1px solid var(--border);
      }

      .btn-deny:hover { background: var(--bg); }

      .btn-allow {
        color: white;
        background: var(--green);
      }

      .btn-allow:hover { background: var(--green-hover); }

      /* ── States ── */
      .loading-state {
        text-align: center;
        padding: 32px 0;
        color: var(--text-muted);
        font-size: 12px;
      }

      .error-state {
        padding: 10px 12px;
        border-radius: var(--radius);
        background: var(--red-soft);
        color: var(--red);
        font-size: 12px;
        border: 1px solid #fecaca;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="consent-header">
        <div class="consent-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 9v4M12 17h.01"/>
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          </svg>
        </div>
        <div>
          <h1>Allow storage access?</h1>
          <p>A website wants to connect to your remoteStorage account through this extension.</p>
        </div>
      </div>

      <div id="loading" class="loading-state">Loading request details...</div>

      <div id="details" class="detail-card" hidden>
        <div class="detail-row">
          <span class="detail-label">Origin</span>
          <span class="detail-value" id="origin-value"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Scopes</span>
          <span class="detail-value" id="scopes-value"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Account</span>
          <span class="detail-value" id="account-value"></span>
        </div>
      </div>

      <label id="remember-label" class="remember-row" hidden>
        <input type="checkbox" id="remember" checked />
        <span>Remember this decision for this site</span>
      </label>

      <div id="consent-actions" class="actions" hidden>
        <button class="btn btn-deny" id="deny-btn">Deny</button>
        <button class="btn btn-allow" id="allow-btn">Allow</button>
      </div>

      <div id="error" class="error-state" hidden></div>
    </div>

    <script src="consent.js"></script>
  </body>
</html>
